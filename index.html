<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كري ليا — وسيطك الموثوق في سوق السيارات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      overflow-x: hidden;
    }

    /* نقوش الزليج كخلفية شبه شفافة */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.03) 2px, transparent 2px),
        radial-gradient(circle at 30% 70%, rgba(212, 175, 55, 0.03) 2px, transparent 2px),
        radial-gradient(circle at 60% 40%, rgba(212, 175, 55, 0.03) 2px, transparent 2px),
        radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.03) 2px, transparent 2px);
      background-size: 100px 100px;
      pointer-events: none;
      z-index: -1;
    }

    .story-section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      padding: 20px;
    }

    .avatar {
      font-size: 6rem;
      margin-bottom: 20px;
      transition: transform 0.5s ease;
    }

    .question-mark {
      font-size: 3rem;
      color: #D4AF37;
      margin-bottom: 40px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .window {
      width: 300px;
      height: 200px;
      background: rgba(30, 30, 30, 0.7);
      border: 4px solid #D4AF37;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .window::before {
      content: "";
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border-radius: 16px;
      background: 
        linear-gradient(135deg, transparent 10px, #D4AF37 10px, #D4AF37 12px, transparent 12px),
        linear-gradient(225deg, transparent 10px, #D4AF37 10px, #D4AF37 12px, transparent 12px),
        linear-gradient(45deg, transparent 10px, #D4AF37 10px, #D4AF37 12px, transparent 12px),
        linear-gradient(315deg, transparent 10px, #D4AF37 10px, #D4AF37 12px, transparent 12px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: -1;
    }

    .window h2 {
      font-size: 2.2rem;
      color: #D4AF37;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    .garage {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 70%;
      background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), 
                  url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100"><rect x="20" y="30" width="40" height="20" fill="%23D4AF37" opacity="0.1"/><rect x="90" y="20" width="30" height="30" fill="%23D4AF37" opacity="0.1"/><rect x="140" y="40" width="50" height="15" fill="%23D4AF37" opacity="0.1"/></svg>');
      background-size: 300px;
      background-repeat: repeat-x;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: translateY(50px);
      transition: all 0.8s ease;
    }

    .garage.active {
      opacity: 1;
      transform: translateY(0);
    }

    .garage h3 {
      font-size: 2.5rem;
      color: #D4AF37;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.7);
    }

    .actions {
      padding: 80px 20px 60px;
      text-align: center;
    }

    .actions h2 {
      font-size: 2.4rem;
      margin-bottom: 50px;
      color: #fff;
    }

    .wheels {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      margin-top: 30px;
    }

    .wheel-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid #D4AF37;
      background: 
        radial-gradient(circle, #000 45%, transparent 46%),
        conic-gradient(from 0deg, 
          transparent 0deg, #D4AF37 1deg, transparent 3deg,
          transparent 45deg, #D4AF37 46deg, transparent 48deg,
          transparent 90deg, #D4AF37 91deg, transparent 93deg,
          transparent 135deg, #D4AF37 136deg, transparent 138deg,
          transparent 180deg, #D4AF37 181deg, transparent 183deg,
          transparent 225deg, #D4AF37 226deg, transparent 228deg,
          transparent 270deg, #D4AF37 271deg, transparent 273deg,
          transparent 315deg, #D4AF37 316deg, transparent 318deg);
      background-size: 100% 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.6s ease, box-shadow 0.3s ease;
      user-select: none;
    }

    .wheel-btn:hover {
      transform: rotate(45deg);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
    }

    .wheel-btn i {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    footer {
      padding: 30px;
      text-align: center;
      color: #aaa;
      font-size: 1.1rem;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .wheel-btn {
        width: 130px;
        height: 130px;
        font-size: 0.95rem;
      }
      .wheels { gap: 25px; }
      .window { width: 250px; height: 160px; }
      .avatar { font-size: 4.5rem; }
    }
  </style>
</head>
<body>

  <section class="story-section">
    <div class="avatar" id="avatar">🤔</div>
    <div class="question-mark">؟</div>
    <div class="window" id="window">
      <h2>كري ليا</h2>
    </div>
    <div class="garage" id="garage">
      <h3>مرآب السيارات 🚗</h3>
    </div>
  </section>

  <section class="actions">
    <h2>الآن، سوق السيارات أصبح أبسط</h2>
    <div class="wheels">
      <div class="wheel-btn" onclick="alert('سيتم فتح نموذج إضافة السيارة قريباً!')">
        <div>➕</div>
        أضف<br>سيارتك
      </div>
      <div class="wheel-btn" onclick="alert('سيتم فتح نموذج البحث عن كراء قريباً!')">
        <div>🔍</div>
        ابحث عن<br>سيارة للكراء
      </div>
    </div>
  </section>

  <footer>
    وسيطك الموثوق في سوق السيارات — المغرب 🇲🇦
  </footer>

  <script>
    const windowEl = document.getElementById('window');
    const garageEl = document.getElementById('garage');
    const avatarEl = document.getElementById('avatar');

    windowEl.addEventListener('click', () => {
      garageEl.classList.add('active');
      avatarEl.textContent = '😊';
      avatarEl.style.transform = 'scale(1.1)';
      
      // منع التكرار بعد الضغط الأول
      windowEl.style.pointerEvents = 'none';
      windowEl.style.opacity = '0.8';
    });
  </script>

</body>
    </html>
