<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كري ليا — وسيطك الموثوق في كراء السيارات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      overflow-x: hidden;
    }

    /* نقوش الزليج */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.03) 2px, transparent 2px),
        radial-gradient(circle at 30% 70%, rgba(212, 175, 55, 0.03) 2px, transparent 2px),
        radial-gradient(circle at 60% 40%, rgba(212, 175, 55, 0.03) 2px, transparent 2px),
        radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.03) 2px, transparent 2px);
      background-size: 100px 100px;
      pointer-events: none;
      z-index: -1;
    }

    .story-section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      padding: 20px;
    }

    .avatar-container {
      width: 200px;
      height: 300px;
      margin-bottom: 20px;
      position: relative;
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    .avatar.hidden {
      opacity: 0;
      position: absolute;
      top: 0;
      left: 0;
    }

    .question-mark {
      font-size: 3rem;
      color: #D4AF37;
      margin-bottom: 40px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .window {
      width: 300px;
      height: 200px;
      background: rgba(30, 30, 30, 0.7);
      border: 4px solid #D4AF37;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .window h2 {
      font-size: 2.2rem;
      color: #D4AF37;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    .garage {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 70%;
      background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
                  repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(212,175,55,0.05) 10px, rgba(212,175,55,0.05) 12px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: translateY(50px);
      transition: all 0.8s ease;
    }

    .garage.active {
      opacity: 1;
      transform: translateY(0);
    }

    .garage h3 {
      font-size: 2.5rem;
      color: #D4AF37;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.7);
    }

    .actions {
      padding: 80px 20px 60px;
      text-align: center;
    }

    .actions h2 {
      font-size: 2.4rem;
      margin-bottom: 50px;
      color: #fff;
    }

    .wheels {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
      margin-top: 30px;
    }

    .wheel-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid #D4AF37;
      background: 
        radial-gradient(circle, #000 45%, transparent 46%),
        conic-gradient(from 0deg, 
          transparent 0deg, #D4AF37 1deg, transparent 3deg,
          transparent 45deg, #D4AF37 46deg, transparent 48deg,
          transparent 90deg, #D4AF37 91deg, transparent 93deg,
          transparent 135deg, #D4AF37 136deg, transparent 138deg,
          transparent 180deg, #D4AF37 181deg, transparent 183deg,
          transparent 225deg, #D4AF37 226deg, transparent 228deg,
          transparent 270deg, #D4AF37 271deg, transparent 273deg,
          transparent 315deg, #D4AF37 316deg, transparent 318deg);
      background-size: 100% 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.6s ease, box-shadow 0.3s ease;
      user-select: none;
    }

    .wheel-btn:hover {
      transform: rotate(45deg);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
    }

    footer {
      padding: 30px;
      text-align: center;
      color: #aaa;
      font-size: 1.1rem;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      margin-top: 20px;
    }

    /* === نماذج منبثقة === */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .popup {
      background: #0a0a0a;
      width: 90%;
      max-width: 500px;
      border-radius: 16px;
      border: 2px solid #D4AF37;
      padding: 30px;
      position: relative;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    }

    .popup h3 {
      color: #D4AF37;
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 1.8rem;
      color: #D4AF37;
      background: none;
      border: none;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: white;
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: 2px solid #D4AF37;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #D4AF37;
      color: #000;
      font-weight: bold;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #FFD700;
    }

    @media (max-width: 600px) {
      .avatar-container { width: 150px; height: 225px; }
      .wheel-btn { width: 130px; height: 130px; font-size: 0.95rem; }
      .popup { padding: 20px; }
      .popup h3 { font-size: 1.5rem; }
    }
  </style>
</head>

  <script>
    // --- التصحيح: ضمان تحميل كامل للصفحة ---
    document.addEventListener('DOMContentLoaded', function() {
      const windowEl = document.getElementById('window');
      const garageEl = document.getElementById('garage');
      const avatar1 = document.getElementById('avatar1');
      const avatar2 = document.getElementById('avatar2');

      if (windowEl) {
        windowEl.addEventListener('click', () => {
          garageEl.classList.add('active');
          avatar1.classList.add('hidden');
          avatar2.classList.remove('hidden');
          windowEl.style.pointerEvents = 'none';
          windowEl.style.opacity = '0.8';
        });
      }

      // دوال الفتح/الإغلاق
      window.openPopup = function(type) {
        const popup = document.getElementById(type + 'Popup');
        if (popup) {
          popup.classList.add('active');
          document.body.style.overflow = 'hidden';
        }
      };

      window.closePopup = function(type) {
        const popup = document.getElementById(type + 'Popup');
        if (popup) {
          popup.classList.remove('active');
          document.body.style.overflow = '';
        }
      };

      // إغلاق النموذج بالنقر خارجه
      document.querySelectorAll('.overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
          }
        });
      });

      // معالجة الإرسال
      const sellForm = document.getElementById('sellForm');
      const rentForm = document.getElementById('rentForm');

      if (sellForm) {
        sellForm.addEventListener('submit', function(e) {
          e.preventDefault();
          const data = new FormData(this);
          let msg = `مرحبًا بكم في كري ليا 🌟\nأرغب في عرض سيارتي للكراء عبر وسيط موثوق:\n`;
          msg += `• النوع: ${data.get('type')}\n`;
