<head><meta charset="UTF-8"><title>من نحن — كري ليا</title></head>
<body style="background:#000;color:#fff;font-family:Tajawal;padding:20px">
<h1 style="color:#D4AF37">من نحن</h1>
<p>كري ليا خدمة وساطة بشرية مغربية، هدفها تسهيل كراء السيارات بين الأفراد بطريقة مبنية على الثقة والتواصل المباشر.</p>
<p>لا نقوم بتأجير السيارات، ولا نملك أي مركبة، ولا نمثل أي شركة. دورنا يقتصر على الربط بين الطرفين فقط.</p>
<p>نؤمن أن الوساطة الحقيقية تبدأ بالثقة، لا بالدفع.</p>
</body>
</html>
